name: image

on: # yamllint disable-line rule:truthy
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-image.yml
      - ./images/amd64.dockerfile
      - ./images/bytecode-redirect.dockerfile
      - ./internal/bpf/xdp-afxdp-redirect/**
  pull_request:
    paths:
      - .github/workflows/build-image.yml
      - ./images/amd64.dockerfile
      - ./images/bytecode-redirect.dockerfile
      - ./internal/bpf/xdp-afxdp-redirect/**
  workflow_dispatch:

env:
  # change this one line when the quay organisation changes
  REGISTRY_ORG: quay.io/afxdp-plugins-for-kubernetes

jobs:
  image_build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      packages: write
    strategy:
      fail-fast: false
      # Build one image at a time to reduce anonymous ECR Public pull rate limits.
      max-parallel: 1
      matrix:
        include:
          - IMAGE_NAME: afxdp-device-plugin
            IMAGE_FILE: ./images/amd64.dockerfile
            PLATFORMS: linux/amd64
            LABEL: latest
          - IMAGE_NAME: xdp-afxdp-redirect
            IMAGE_FILE: ./images/bytecode-redirect.dockerfile
            PLATFORMS: linux/amd64,linux/arm64
            LABEL: latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # NOTE:  setting fetch-depth to 0 to retrieve the entire history
          # instead of a shallow-clone so that all tags are fetched as well.
          # This is necessary for computing the VERSION using `git describe`
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          image: tonistiigi/binfmt:qemu-v8.1.5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Pre-pull ECR Public base images
        if: matrix.IMAGE_NAME == 'afxdp-device-plugin'
        uses: nick-fields/retry@ce71cc2a7642dacbe1aa121138346450f155aa88 # v3.0.0
        with:
          timeout_minutes: 15
          max_attempts: 5
          retry_wait_seconds: 90
          command: |
            docker pull public.ecr.aws/docker/library/golang:1.25@sha256:2c7ebcaf2c1032b4b4d15df14b7edf3221b1e45dadfaa36ab6a2f8555feacaa6
            docker pull public.ecr.aws/docker/library/golang:1.25-alpine@sha256:56961d79ea8129efddcc0b8643fd8a5416b4e6228cfd477e3fd61deb2672c587
            docker pull public.ecr.aws/docker/library/alpine:3.21@sha256:48b0309ca019d89d40f670aa1bc06e426dc0931948452e8491e3d65087abc07d

      - name: Set up cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Login to Quay
        if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_ORG }}
          username: ${{ secrets.quay_username }}
          password: ${{ secrets.quay_robot_token }}

      - name: Build and (conditionally) push image
        id: build-push-image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.PLATFORMS }}
          push: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
          tags: ${{ env.REGISTRY_ORG }}/${{ matrix.IMAGE_NAME }}:${{ matrix.LABEL }}
          labels: ${{ matrix.LABEL }}
          build-args: ${{matrix.BUILD_ARGS}}
          file: ${{ matrix.IMAGE_FILE }}

      - name: Sign images with GitHub OIDC Token
        if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
        run: |
          cosign sign -y ${{ env.REGISTRY_ORG }}/${{ matrix.IMAGE_NAME }}:${{ matrix.LABEL }}@${{ steps.build-push-image.outputs.digest }}

      - name: Generate image attestation
        if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}

        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY_ORG }}/${{ matrix.IMAGE_NAME }}
          subject-digest: ${{ steps.build-push-image.outputs.digest }}
          push-to-registry: true
