name: 'Public-CI'

on: [push, pull_request]

permissions:  # added using https://github.com/step-security/secure-repo
  contents: read

jobs:

# Super-linter consists of several lint tools
# lint tools are assigned to the pipeline via the env field
# For more information, please see https://github.com/github/super-linter
  super-linter:
    permissions:
      contents: read  # for actions/checkout to fetch code
      statuses: write  # for github/super-linter to mark status of each linter run
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        fetch-depth: 0
    - name: super-linter
      uses: github/super-linter@12150456a73e248bdc94d0794898f94e23127c88 # v7
      env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LINTER_RULES_PATH: /
          VALIDATE_BASH: true
          # Go linting runs in the go-static-tools job: internal/bpf needs
          # libxdp (cgo), which is not available inside the super-linter
          # container.
          VALIDATE_GO: false
          VALIDATE_DOCKERFILE_HADOLINT: true
          VALIDATE_CLANG_FORMAT: true
          VALIDATE_JSON: true

# Build stage executes binary builds for CNI and device-plugin
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version: 1.25

    - name: Install dependencies
      run: |
          sudo apt update
          sudo apt install -y wget build-essential golang libbsd-dev libelf-dev libjson-c-dev\
            libnl-3-dev libnl-cli-3-dev libnuma-dev libpcap-dev meson\
            pkg-config wget zstd clang llvm gcc-multilib m4

    - name: Install libbpf
      run: |
          wget -q -O /tmp/libbpf-1.5.0.tar.gz https://github.com/libbpf/libbpf/archive/refs/tags/v1.5.0.tar.gz \
          && echo "53492aff6dd47e4da04ef5e672d753b9743848bdb38e9d90eafbe190b7983c44  /tmp/libbpf-1.5.0.tar.gz" | sha256sum --check \
          && tar -xzf /tmp/libbpf-1.5.0.tar.gz -C "${GITHUB_WORKSPACE}" \
          && sudo make -j -C "${GITHUB_WORKSPACE}"/libbpf-1.5.0/src install \
          && sudo rm -rf "${GITHUB_WORKSPACE}"/libbpf-1.5.0 /tmp/libbpf-1.5.0.tar.gz

    - name: Install libxdp
      run: |
          wget -q -O /tmp/xdp-tools-1.4.2.tar.gz https://github.com/xdp-project/xdp-tools/releases/download/v1.4.2/xdp-tools-1.4.2.tar.gz \
          && echo "2c916b5a9d26e64e8003e9b7d0e168c74520bff7a30f0345c80ae15eafc4ed0f  /tmp/xdp-tools-1.4.2.tar.gz" | sha256sum --check \
          && tar -xzf /tmp/xdp-tools-1.4.2.tar.gz -C "${GITHUB_WORKSPACE}" \
          && cd "${GITHUB_WORKSPACE}"/xdp-tools-1.4.2 && ./configure && cd - \
          && sudo make -j -C "${GITHUB_WORKSPACE}"/xdp-tools-1.4.2 PREFIX=/usr install \
          && sudo rm -rf "${GITHUB_WORKSPACE}"/xdp-tools-1.4.2 /tmp/xdp-tools-1.4.2.tar.gz \
          && pkg-config --libs --static libelf

    - name: Run build
      run: make fixup && make build

# go-static-tools scans code base and packages using go-vet, go mod verify and staticcheck
  go-static-tools:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version: 1.25

    - name: Install dependencies
      run: |
          sudo apt update
          sudo apt install -y wget build-essential golang libbsd-dev libelf-dev libjson-c-dev\
            libnl-3-dev libnl-cli-3-dev libnuma-dev libpcap-dev meson\
            pkg-config wget zstd clang llvm gcc-multilib m4

    - name: Install libbpf
      run: |
          wget -q -O /tmp/libbpf-1.5.0.tar.gz https://github.com/libbpf/libbpf/archive/refs/tags/v1.5.0.tar.gz \
          && echo "53492aff6dd47e4da04ef5e672d753b9743848bdb38e9d90eafbe190b7983c44  /tmp/libbpf-1.5.0.tar.gz" | sha256sum --check \
          && tar -xzf /tmp/libbpf-1.5.0.tar.gz -C "${GITHUB_WORKSPACE}" \
          && sudo make -j -C "${GITHUB_WORKSPACE}"/libbpf-1.5.0/src install \
          && sudo rm -rf "${GITHUB_WORKSPACE}"/libbpf-1.5.0 /tmp/libbpf-1.5.0.tar.gz

    - name: Install libxdp
      run: |
          wget -q -O /tmp/xdp-tools-1.4.2.tar.gz https://github.com/xdp-project/xdp-tools/releases/download/v1.4.2/xdp-tools-1.4.2.tar.gz \
          && echo "2c916b5a9d26e64e8003e9b7d0e168c74520bff7a30f0345c80ae15eafc4ed0f  /tmp/xdp-tools-1.4.2.tar.gz" | sha256sum --check \
          && tar -xzf /tmp/xdp-tools-1.4.2.tar.gz -C "${GITHUB_WORKSPACE}" \
          && cd "${GITHUB_WORKSPACE}"/xdp-tools-1.4.2 && ./configure && cd - \
          && sudo make -j -C "${GITHUB_WORKSPACE}"/xdp-tools-1.4.2 PREFIX=/usr install \
          && sudo rm -rf "${GITHUB_WORKSPACE}"/xdp-tools-1.4.2 /tmp/xdp-tools-1.4.2.tar.gz \
          && pkg-config --libs --static libelf

    - name: Install staticcheck
      run: go install honnef.co/go/tools/cmd/staticcheck@2026.1

    - name: Run golangci-lint
      run: |
          docker run --rm -v "${GITHUB_WORKSPACE}":/app -w /app golangci/golangci-lint:v2.12.2 sh -c \
            "apt-get update -qq >/dev/null && apt-get install -qq -y --no-install-recommends libxdp-dev libbpf-dev pkg-config >/dev/null && golangci-lint run"

    - name: run static analysis
      run: make static-ci

# unit-test stage
  unit-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version: 1.25

    - name: Install dependencies
      run: |
          sudo apt update
          sudo apt install -y wget build-essential golang libbsd-dev libelf-dev libjson-c-dev\
            libnl-3-dev libnl-cli-3-dev libnuma-dev libpcap-dev meson\
            pkg-config wget zstd clang llvm gcc-multilib m4

    - name: Install libbpf
      run: |
          wget -q -O /tmp/libbpf-1.5.0.tar.gz https://github.com/libbpf/libbpf/archive/refs/tags/v1.5.0.tar.gz \
          && echo "53492aff6dd47e4da04ef5e672d753b9743848bdb38e9d90eafbe190b7983c44  /tmp/libbpf-1.5.0.tar.gz" | sha256sum --check \
          && tar -xzf /tmp/libbpf-1.5.0.tar.gz -C "${GITHUB_WORKSPACE}" \
          && sudo make -j -C "${GITHUB_WORKSPACE}"/libbpf-1.5.0/src install \
          && sudo rm -rf "${GITHUB_WORKSPACE}"/libbpf-1.5.0 /tmp/libbpf-1.5.0.tar.gz

    - name: Install libxdp
      run: |
          wget -q -O /tmp/xdp-tools-1.4.2.tar.gz https://github.com/xdp-project/xdp-tools/releases/download/v1.4.2/xdp-tools-1.4.2.tar.gz \
          && echo "2c916b5a9d26e64e8003e9b7d0e168c74520bff7a30f0345c80ae15eafc4ed0f  /tmp/xdp-tools-1.4.2.tar.gz" | sha256sum --check \
          && tar -xzf /tmp/xdp-tools-1.4.2.tar.gz -C "${GITHUB_WORKSPACE}" \
          && cd "${GITHUB_WORKSPACE}"/xdp-tools-1.4.2 && ./configure && cd - \
          && sudo make -j -C "${GITHUB_WORKSPACE}"/xdp-tools-1.4.2 PREFIX=/usr install \
          && sudo rm -rf "${GITHUB_WORKSPACE}"/xdp-tools-1.4.2 /tmp/xdp-tools-1.4.2.tar.gz \
          && pkg-config --libs --static libelf

    - name: unit-tests
      run: make test
